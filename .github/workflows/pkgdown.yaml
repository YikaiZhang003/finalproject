name: Build site
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pkgdown
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto
          needs: website
      - name: Set up package
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION")
          if (d[1, "Package"] == "bst260project") {
            d[1, "Package"] <- "finalproject"
            d[1, "Title"] <- "BST260 Final Project"
            d[1, "Authors@R"] <- 'person("Yikai", "Zhang", role = c("aut", "cre"), email = "YikaiZhang003@users.noreply.github.com")'
            d[1, "Description"] <- "Coursework for BST260. Uses public health datasets. Includes data analysis and visualization."
            d[1, "URL"] <- "https://YikaiZhang003.github.io/finalproject/"
            d[1, "BugReports"] <- "https://github.com/YikaiZhang003/finalproject/issues"
            d[1, "Suggests"] <- "knitr, testthat, rmarkdown, pkgdown, quarto"
            write.dcf(d, "DESCRIPTION")
            writeLines("# finalproject", "README.md")
            writeLines(c("url: https://YikaiZhang003.github.io/finalproject/", "destination: docs", "template:", "  bootstrap: 5"), "_pkgdown.yml")
          }
      - name: Install package
        run: |
          R CMD INSTALL .
          Rscript -e 'data("waterborne", package="finalproject"); stopifnot(exists("waterborne"))'
      - name: Build site
        run: Rscript -e 'pkgdown::build_site()'
      - name: Save site
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESCRIPTION README.md _pkgdown.yml docs
          if ! git diff --cached --quiet; then
            git commit -m "Set up final project"
            git push
          fi
      - name: Publish site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
