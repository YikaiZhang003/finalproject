name: Build site
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pkgdown
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, any::devtools, any::remotes
          needs: website
      - name: Update package references
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION")
          d[1, "URL"] <- "https://github.com/YikaiZhang003/finalproject, https://YikaiZhang003.github.io/finalproject/"
          write.dcf(d, "DESCRIPTION")
          for (f in c("R/data.R", "man/waterborne.Rd")) {
            x <- readLines(f)
            writeLines(gsub("bst260project", "finalproject", x, fixed = TRUE), f)
          }
      - name: Install package
        run: R CMD INSTALL .
      - name: Build site
        run: Rscript -e 'pkgdown::build_site()'
      - name: Save site
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESCRIPTION R/data.R man/waterborne.Rd docs
          if ! git diff --cached --quiet; then
            git commit -m "Update package references"
            git push
          fi
      - name: Verify GitHub installation
        env:
          GITHUB_PAT: ${{ github.token }}
        shell: Rscript {0}
        run: |
          sha <- system("git rev-parse HEAD", intern = TRUE)
          devtools::install_github("YikaiZhang003/finalproject", ref = sha, upgrade = "never", build_vignettes = FALSE, force = TRUE)
          e <- new.env()
          data("waterborne", package = "finalproject", envir = e)
          stopifnot(exists("waterborne", envir = e, inherits = FALSE), length(e$waterborne) > 0)
          cat("DATA_LOAD_OK: waterborne contains", length(e$waterborne), "records\n")
          cat("R:", as.character(getRversion()), "\n")
          cat("pkgdown:", as.character(packageVersion("pkgdown")), "\n")
          cat("finalproject:", as.character(packageVersion("finalproject")), "\n")
      - name: Publish site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
